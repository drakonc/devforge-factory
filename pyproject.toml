[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "devforge-factory"
version = "0.2.0"
description = "Fábrica local de software orquestada por Claude Code"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Jose Castro" }]
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0,<7"]
keywords = ["agents", "claude-code", "software-factory", "git-worktrees", "code-review"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Software Development",
]

[project.scripts]
devforge = "devforge_factory.cli:main"

[tool.setuptools.packages.find]
include = ["devforge_factory*"]


[tool.setuptools.package-data]
devforge_factory = ["defaults.yaml"]
