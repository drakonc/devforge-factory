name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar bubblewrap
        run: sudo apt-get update && sudo apt-get install -y bubblewrap
      - name: Habilitar namespaces sin privilegios
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - name: Instalar el paquete
        run: python -m pip install --upgrade pip && python -m pip install -e .
      - name: Pruebas
        run: python -m unittest discover -s tests -v

  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar el paquete
        run: python -m pip install --upgrade pip && python -m pip install -e .
      - name: Pruebas
        run: python -m unittest discover -s tests -v

  wheel:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Construir wheel
        run: uv build --wheel
      - name: Verificar skill y agentes empaquetados
        run: |
          unzip -l dist/*.whl | grep -q "devforge_factory/resources/skills/factory/SKILL.md"
          unzip -l dist/*.whl | grep -q "devforge_factory/resources/agents/devforge-builder.md"
